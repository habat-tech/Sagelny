<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة إنجاز - دمج ملفات التسجيل</title>
    <!-- استخدام مكتبة SheetJS لقراءة ودمج ملفات الإكسل بسهولة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 800;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 15px;
        }
        
        .filename-input-group {
            margin-bottom: 20px;
        }
        .filename-input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #0052CC;
            font-size: 14px;
        }
        .filename-input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .filename-input-group input:focus {
            border-color: #0052CC;
            outline: none;
        }

        .upload-area {
            border: 2px dashed #0052CC;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            background-color: #f8faff;
            cursor: pointer;
            transition: background-color 0.3s;
            position: relative;
        }
        .upload-area:hover {
            background-color: #eef3fc;
        }
        /* بنخلي ال input يغطي المساحة بس مش بيتداس عليه مباشرة لو دوسنا على زرار الحذف */
        .file-input-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 1;
        }
        .upload-icon {
            font-size: 40px;
            color: #0052CC;
            margin-bottom: 10px;
        }
        .upload-text {
            color: #0052CC;
            font-weight: bold;
            font-size: 16px;
        }
        .file-list {
            margin-top: 20px;
            max-height: 200px; /* كبرت المساحة شوية */
            overflow-y: auto;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            padding: 10px;
            background-color: #fafbfc;
            display: none;
        }
        .file-list ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .file-list li {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #34495e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-list li:last-child {
            border-bottom: none;
        }
        .file-info {
            display: flex;
            flex-direction: column;
        }
        .file-size {
            font-size: 12px;
            color: #95a5a6;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            transition: transform 0.2s;
            z-index: 2; /* عشان يشتغل فوق مساحة الرفع */
        }
        .delete-btn:hover {
            transform: scale(1.2);
        }
        .file-count-badge {
            background-color: #e67e22;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        button.action-btn {
            width: 100%;
            padding: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s, transform 0.1s;
        }
        button.action-btn:hover {
            background-color: #219653;
        }
        button.action-btn:active {
            transform: scale(0.98);
        }
        button.action-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #statusMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #27ae60;
            display: none;
            padding: 10px;
            border-radius: 6px;
            background-color: #e8f8f5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>أداة دمج ملفات الإكسل</h2>
    <p class="subtitle">حدد كل الملفات اللي الطلبة بعتتها، والأداة هتدمجهم في شيت واحد</p>
    
    <div class="filename-input-group">
        <label for="outputFileName">اسم الملف النهائي (اختياري):</label>
        <input type="text" id="outputFileName" placeholder="مثال: تسجيل الفرقة التانية (بدون .xlsx)">
    </div>

    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" class="file-input-cover" accept=".xlsx, .xls, .csv" multiple onchange="handleNewFiles()">
        <div class="upload-icon">📁</div>
        <div class="upload-text">اضغط هنا لاختيار الملفات أو اسحبها وأفلتها هنا</div>
        <div style="color: #7f8c8d; font-size: 13px; margin-top: 5px;">يمكنك اختيار أو إضافة أكثر من ملف</div>
    </div>

    <div class="file-list" id="fileListContainer">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; color: #0052CC;">
            <span>الملفات المختارة:</span>
            <span class="file-count-badge" id="fileCount">0</span>
        </div>
        <ul id="fileList"></ul>
    </div>

    <button id="mergeBtn" class="action-btn" onclick="mergeExcelFiles()" disabled>دمج وتحميل الملف النهائي</button>
    
    <div id="statusMessage"></div>
</div>

<script>
    // مصفوفة لتخزين الملفات المختارة (عشان نقدر نحذف منها ونضيف عليها)
    let selectedFiles = [];

    // التعامل مع اختيار ملفات جديدة
    function handleNewFiles() {
        const fileInput = document.getElementById('fileInput');
        const newFiles = Array.from(fileInput.files);
        
        // إضافة الملفات الجديدة للمصفوفة
        selectedFiles = selectedFiles.concat(newFiles);
        
        // تفريغ الـ input عشان لو حبيت تختار نفس الملف تاني يقبله
        fileInput.value = ''; 
        
        updateUI();
    }

    // حذف ملف من القائمة
    function removeFile(index) {
        selectedFiles.splice(index, 1);
        updateUI();
    }

    // تحديث واجهة المستخدم (القائمة والعداد والزرار)
    function updateUI() {
        const fileListContainer = document.getElementById('fileListContainer');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const mergeBtn = document.getElementById('mergeBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        fileList.innerHTML = '';
        statusMessage.style.display = 'none';

        if (selectedFiles.length > 0) {
            fileListContainer.style.display = 'block';
            fileCount.textContent = selectedFiles.length;
            mergeBtn.disabled = false;

            selectedFiles.forEach((file, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="file-info">
                        <span>${file.name}</span>
                        <span class="file-size">${(file.size / 1024).toFixed(1)} KB</span>
                    </div>
                    <button class="delete-btn" onclick="removeFile(${index})" title="حذف الملف">❌</button>
                `;
                fileList.appendChild(li);
            });
        } else {
            fileListContainer.style.display = 'none';
            mergeBtn.disabled = true;
        }
    }

    // قراءة الملفات كـ ArrayBuffer
    function readFileAsync(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsArrayBuffer(file);
        });
    }

    // دمج الملفات
    async function mergeExcelFiles() {
        if (selectedFiles.length === 0) return;

        const mergeBtn = document.getElementById('mergeBtn');
        const statusMessage = document.getElementById('statusMessage');
        let outputFileNameInput = document.getElementById('outputFileName').value.trim();
        
        // تحديد اسم الملف النهائي
        let finalFileName = "التسجيل_النهائي_للطلاب.xlsx";
        if (outputFileNameInput) {
            // لو اليوزر كتب اسم، نتأكد إنه مش كاتب الامتداد مرتين
            finalFileName = outputFileNameInput.endsWith('.xlsx') ? outputFileNameInput : outputFileNameInput + '.xlsx';
        }

        mergeBtn.disabled = true;
        mergeBtn.textContent = "جاري الدمج...";

        try {
            let masterData = [];
            let isFirstFile = true;
            let totalRows = 0;

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const data = await readFileAsync(file);
                
                // قراءة الملف باستخدام SheetJS
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل الشيت لمصفوفة (Array of Arrays)
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                if (jsonData.length > 0) {
                    if (isFirstFile) {
                        // لو ده أول ملف، بناخد البيانات كلها (بما فيها صف العناوين)
                        masterData = masterData.concat(jsonData);
                        isFirstFile = false;
                        totalRows += jsonData.length - 1; // بنقص صف العناوين من العد
                    } else {
                        // لو ملف تاني، بنتجاهل أول صف (صف العناوين) وبناخد الباقي
                        const dataWithoutHeader = jsonData.slice(1);
                        masterData = masterData.concat(dataWithoutHeader);
                        totalRows += dataWithoutHeader.length;
                    }
                }
            }

            // إنشاء ملف إكسل جديد بالبيانات المدمجة
            const newWorkbook = XLSX.utils.book_new();
            const newWorksheet = XLSX.utils.aoa_to_sheet(masterData);
            
            // ضبط اتجاه الشيت لليمين (عربي)
            if(!newWorkbook.Workbook) newWorkbook.Workbook = {};
            if(!newWorkbook.Workbook.Views) newWorkbook.Workbook.Views = [];
            newWorkbook.Workbook.Views.push({ RTL: true });

            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "المقررات المجمعة");

            // تحميل الملف النهائي بالاسم المختار
            XLSX.writeFile(newWorkbook, finalFileName);

            // إظهار رسالة نجاح
            statusMessage.style.display = 'block';
            statusMessage.textContent = `✅ تم دمج ${selectedFiles.length} ملف بنجاح! إجمالي المقررات المسجلة: ${totalRows} مادة في ملف "${finalFileName}".`;
            mergeBtn.textContent = "دمج وتحميل الملف النهائي";
            mergeBtn.disabled = false;

            // اختياري: تفريغ القائمة بعد الدمج الناجح (لو حابب تسيبها شيل السطرين دول)
            // selectedFiles = [];
            // updateUI();

        } catch (error) {
            console.error(error);
            alert("حصلت مشكلة أثناء الدمج! يرجى التأكد إن الملفات مش تالفة وإنها ملفات إكسل صحيحة.");
            mergeBtn.textContent = "دمج وتحميل الملف النهائي";
            mergeBtn.disabled = false;
        }
    }
</script>

</body>
</html>
